name: Privacy and secrets
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Scan full history
        run: |
          if ! docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo:ro" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1 git --log-opts=--all --config .gitleaks.toml --redact=100 --no-banner . >/dev/null 2>&1; then
            echo 'Full-history privacy/secret scan failed or could not complete.'
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - name: Scan npm package contents
        run: node scripts/scan-package.js --docker
