# Test on Ubuntu and publish to npmjs.org on GitHub Release using npm trusted
# publishing (OIDC). No NPM_TOKEN.
# publish-npm uses Node 24 so npm is new enough for OIDC (Node 20 / npm 10 → ENEEDAUTH).
# The test job stays on Node 22 (node:sqlite needs 22.5+).

name: Test and Publish

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

jobs:
  nightscout:
    uses: ./.github/workflows/nightscout.yml

  python-runtime:
    uses: ./.github/workflows/python-runtime.yml

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  publish-npm:
    if: github.event_name == 'release'
    needs: [test, nightscout, python-runtime]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      # dist/ is gitignored; package.json "files" includes dist/. Build before publish.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Provision scanners for prepublish gates
        run: |
          bash .cursor/install-security.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm run build
      - name: Scan release history
        run: |
          if ! docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo:ro" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1 git --log-opts=--all --config .gitleaks.toml --redact=100 --no-banner . >/dev/null 2>&1; then
            echo 'Release history privacy/secret scan failed or could not complete.'
            exit 1
          fi
      - run: npm publish
        env:
          CI: "true"
