name: Dependency and code security
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned scanners and run full gates
        run: bash .cursor/install-security.sh
      - name: Verify repeat setup and negative enforcement probes
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          before="$(sha256sum "$(readlink -f "$(command -v semgrep)")")"
          bash .cursor/install-security.sh
          test "$before" = "$(sha256sum "$(readlink -f "$(command -v semgrep)")")"
          test "$(git config core.hooksPath)" = .githooks
          python3 .security/test_gates.py
          python3 .security/test_standard.py
